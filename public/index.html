<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגמל הצייץ | הפועל באר שבע - בלי רעש. רק מה שחשוב.</title>
<meta name="description" content="הגמל הצייץ - מבזקים, כתבות, תוצאות וסטטיסטיקות של הפועל באר שבע. טקסט בלבד, בזמן אמת.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0B; --bg2:#111111; --line:#1E1E1E; --line2:#2A2A2A;
  --txt:#EDEDED; --dim:#8F8F8F; --dim2:#5C5C5C;
  --red:#E01F2E;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Heebo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.6;overflow-x:hidden;padding-bottom:76px}
::selection{background:var(--red);color:#fff}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
#pbar{position:fixed;top:0;right:0;height:2px;background:var(--red);width:0;z-index:99;transition:width .1s linear}
header{position:sticky;top:0;z-index:50;background:rgba(11,11,11,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:baseline;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.3px}
.brand .dot{color:var(--red);font-size:13px}
.brand .city{color:var(--dim);font-weight:400;font-size:14px}
.brand .city::before{content:"|";margin-left:10px;color:var(--line2)}
nav.top{display:flex;gap:22px;font-size:13.5px;color:var(--dim)}
nav.top a{position:relative;padding:4px 0;transition:color .2s}
nav.top a:hover{color:var(--txt)}
nav.top a::after{content:"";position:absolute;bottom:0;right:0;width:0;height:1.5px;background:var(--red);transition:width .25s}
nav.top a:hover::after{width:100%}
nav.top a.live{color:var(--red);font-weight:700}
.lockbtn{color:var(--dim2)!important}
.hero{padding:64px 0 40px;border-bottom:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:.5px;margin-bottom:14px}
.hero h1{font-size:clamp(44px,9vw,96px);font-weight:900;line-height:1.02;letter-spacing:-2px}
.hero h1 .q{color:var(--red)}
.latest{margin-top:44px;display:grid;grid-template-columns:110px 1fr;gap:24px;align-items:start;border-right:3px solid var(--red);padding-right:22px;cursor:pointer}
.latest .t{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--red);line-height:1.1}
.latest .tx{font-size:clamp(19px,3vw,26px);font-weight:700;line-height:1.35}
.latest .meta{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--dim2)}
section.block{padding:56px 0;border-bottom:1px solid var(--line)}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:34px}
.sec-hd h2{font-size:clamp(24px,4vw,34px);font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
.sec-hd .tag{font-family:var(--mono);font-size:11px;color:var(--dim2);letter-spacing:.8px}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);animation:pl 1.6s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(224,31,46,.5)}55%{box-shadow:0 0 0 9px rgba(224,31,46,0)}}
.tl{position:relative;padding-right:34px}
.tl::before{content:"";position:absolute;right:8px;top:6px;bottom:6px;width:1.5px;background:linear-gradient(var(--red),var(--line2))}
.tl-item{position:relative;padding:0 0 30px 0}
.tl-item:last-child{padding-bottom:0}
.tl-item .dot{position:absolute;right:-31px;top:7px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--red);background:var(--bg)}
.tl-item.hot .dot{background:var(--red)}
.tl-item.bolt .dot{border-color:var(--txt)}
.tl-item .tt{font-family:var(--mono);font-size:13px;color:var(--red);font-weight:600}
.tl-item.bolt .tt{color:var(--dim)}
.tl-item .bx{font-size:17.5px;font-weight:500;margin-top:2px;line-height:1.45}
.tl-item .ago{font-family:var(--mono);font-size:11px;color:var(--dim2);margin-top:2px}
.hotrow{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:26px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s}
.hotrow:first-of-type{border-top:1px solid var(--line)}
.hotrow:hover{background:var(--bg2)}
.hotrow .num{font-family:var(--mono);font-size:56px;font-weight:600;color:transparent;-webkit-text-stroke:1.5px var(--red);line-height:.9}
.hotrow h3{font-size:clamp(19px,3vw,25px);font-weight:800;line-height:1.3}
.hotrow .hm{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:16px;flex-wrap:wrap}
.hotrow .hm .r{color:var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:0 44px}
.tcard{padding:26px 0 30px;border-top:2px solid var(--txt);cursor:pointer;transition:transform .2s}
.tcard:hover{transform:translateY(-2px)}
.tcard:hover h3{color:var(--red)}
.tcard .cat{font-family:var(--mono);font-size:11.5px;color:var(--red);letter-spacing:1px;font-weight:600}
.tcard h3{font-size:clamp(20px,3vw,27px);font-weight:800;line-height:1.3;margin:10px 0 8px;transition:color .2s}
.tcard p{color:var(--dim);font-size:15px;line-height:1.65}
.tcard .dt{margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--dim2)}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
.match{padding:34px 0;border-top:2px solid var(--txt)}
.match .round{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:1px;text-align:center}
.score{display:flex;align-items:center;justify-content:center;gap:34px;margin:20px 0 8px;text-align:center}
.score .team{font-size:clamp(16px,2.6vw,22px);font-weight:700;width:180px}
.score .nums{font-family:var(--mono);font-weight:600;font-size:clamp(46px,8vw,72px);line-height:1;display:flex;align-items:center;gap:16px}
.score .nums .h{color:var(--red)}
.score .nums .dv{color:var(--dim2);font-size:.55em}
.match .st{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
.match .st.live{color:var(--red);font-weight:600}
.events{max-width:420px;margin:26px auto 0;font-family:var(--mono);font-size:13.5px}
.events .ev{display:flex;gap:14px;padding:7px 0;border-bottom:1px dashed var(--line2);color:var(--dim)}
.events .ev:last-child{border-bottom:none}
.events .ev .m{color:var(--red);min-width:36px;font-weight:600}
.events .ev .x{color:var(--txt)}
.stats{display:grid;grid-template-columns:280px 1fr;gap:44px;align-items:start}
.rank{background:var(--bg2);border:1px solid var(--line);padding:34px;text-align:center}
.rank .lbl{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:1px}
.rank .big{font-family:var(--mono);font-size:110px;font-weight:600;color:var(--red);line-height:1.05;margin-top:6px}
.srows .sr{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.srows .sr b{font-family:var(--mono);font-size:19px;font-weight:600}
.srows .sr b.w{color:var(--red)}
.barline{margin-top:26px;font-family:var(--mono);font-size:15px;letter-spacing:1px;color:var(--dim2);white-space:nowrap;overflow:hidden}
.barline .f{color:var(--red)}
.barline .pc{color:var(--txt);margin-right:12px;font-weight:600}
@media(max-width:720px){.stats{grid-template-columns:1fr}}
.pollq{font-size:clamp(21px,3.4vw,30px);font-weight:800;line-height:1.35;margin-bottom:26px}
.opt{cursor:pointer;padding:16px 0;border-bottom:1px solid var(--line)}
.opt .orow{display:flex;justify-content:space-between;align-items:baseline}
.opt .ol{font-size:18px;font-weight:700}
.opt .op{font-family:var(--mono);font-size:15px;color:var(--red);font-weight:600}
.opt .barline{margin-top:8px}
.opt:hover .ol{color:var(--red)}
.pollvoted .opt{cursor:default}
.polltotal{margin-top:20px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.polltotal b{color:var(--txt)}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.brow:hover .bt{color:var(--red)}
.brow .bt{font-size:18px;font-weight:700;transition:color .2s}
.brow .bm{font-family:var(--mono);font-size:12px;color:var(--dim2);white-space:nowrap}
footer{padding:70px 0 40px;text-align:center}
.foot-brand{font-weight:900;font-size:clamp(34px,7vw,58px);letter-spacing:-1px;color:transparent;-webkit-text-stroke:1px var(--line2)}
.foot-brand .r{-webkit-text-stroke:1px var(--red)}
footer .fl{font-family:var(--mono);font-size:11.5px;color:var(--dim2);margin-top:18px}
nav.bottom{display:none;position:fixed;bottom:0;right:0;left:0;z-index:60;background:rgba(11,11,11,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);height:64px;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--dim)}
nav.bottom a .i{font-size:18px}
nav.bottom a.liveb{position:relative}
nav.bottom a.liveb .c{position:absolute;top:-20px;width:52px;height:52px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 22px rgba(224,31,46,.45);color:#fff}
nav.bottom a.liveb span.lb{margin-top:30px;color:var(--red);font-weight:700}
@media(max-width:720px){nav.bottom{display:grid}nav.top{display:none}.hero{padding-top:44px}}
#sheet{position:fixed;inset:auto 0 64px 0;z-index:61;background:var(--bg2);border-top:1px solid var(--line2);padding:10px 20px 18px;display:none}
#sheet.open{display:block}
#sheet a{display:block;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600}
#sheet a:last-child{border:none}
.art{max-width:720px;margin:0 auto;padding:56px 20px}
.art .back{font-family:var(--mono);font-size:13px;color:var(--dim);cursor:pointer}
.art .back:hover{color:var(--red)}
.art .cat{margin-top:30px;font-family:var(--mono);font-size:12px;color:var(--red);letter-spacing:1px;font-weight:600}
.art h1{font-size:clamp(30px,5.6vw,52px);font-weight:900;line-height:1.14;letter-spacing:-1px;margin:14px 0 18px}
.art .meta{font-family:var(--mono);font-size:12.5px;color:var(--dim2);padding-bottom:26px;border-bottom:1px solid var(--line)}
.art .lede{font-size:20px;line-height:1.7;color:var(--txt);border-right:3px solid var(--red);padding-right:20px;margin:30px 0;font-weight:500}
.art .body p{font-size:17.5px;line-height:1.9;color:#D8D8D8;margin-bottom:22px}
.admin{max-width:780px;margin:0 auto;padding:50px 20px}
.admin h1{font-size:30px;font-weight:900;margin-bottom:6px}
.admin .sub{font-family:var(--mono);font-size:12px;color:var(--dim2);margin-bottom:30px}
.atabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.atabs button{background:none;border:1px solid var(--line2);color:var(--dim);font-family:var(--sans);font-size:13.5px;padding:8px 16px;border-radius:99px;cursor:pointer}
.atabs button.on{border-color:var(--red);color:var(--red);font-weight:700}
.afield{margin-bottom:16px}
.afield label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px;font-family:var(--mono)}
.afield input,.afield textarea,.afield select{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-family:var(--sans);font-size:15px;padding:11px 13px;border-radius:6px;outline:none}
.afield input:focus,.afield textarea:focus{border-color:var(--red)}
.abtn{background:var(--red);color:#fff;border:none;font-family:var(--sans);font-weight:700;font-size:15px;padding:12px 30px;border-radius:6px;cursor:pointer}
.abtn:hover{filter:brightness(1.12)}
.alist{margin-top:34px}
.aitem{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.aitem .del{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:5px;padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:12px}
.aitem .del:hover{border-color:var(--red);color:var(--red)}
.msg{font-family:var(--mono);font-size:13px;margin-top:14px}
.msg.ok{color:#4ADE80}.msg.err{color:var(--red)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div id="pbar"></div>
<header>
  <div class="wrap hd">
    <a href="#/" class="brand"><span class="dot">●</span><span id="brandName">הגמל הצייץ</span><span class="city">באר שבע</span></a>
    <nav class="top">
      <a href="#live" class="live">⚡ LIVE</a>
      <a href="#articles">כתבות</a>
      <a href="#matches">משחקים</a>
      <a href="#stats">סטטיסטיקות</a>
      <a href="#/blog">בלוגים</a>
      <a href="#/admin" class="lockbtn">🔐</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<nav class="bottom" id="bnav">
  <a href="#/" data-bn="home"><span class="i">⌂</span>בית</a>
  <a href="#articles" data-bn="articles"><span class="i">📰</span>כתבות</a>
  <a href="#live" class="liveb" data-bn="live"><span class="c">⚡</span><span class="lb">LIVE</span></a>
  <a href="#matches" data-bn="matches"><span class="i">⚽</span>משחקים</a>
  <a href="javascript:void(0)" id="moreBtn" data-bn="more"><span class="i">☰</span>עוד</a>
</nav>
<div id="sheet">
  <a href="#stats">📊 סטטיסטיקות</a>
  <a href="#poll">💬 קול האוהדים</a>
  <a href="#/blog">✍️ בלוגים</a>
  <a href="#/admin">🔐 ניהול</a>
</div>
<script>
/* ================= BRAND - swap here ================= */
const BRAND = "הגמל הצייץ";
const TAGLINE = "הפועל באר שבע - בלי רעש. רק מה שחשוב.";
/* ===================================================== */
document.getElementById("brandName").textContent = BRAND;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function apiList(col) {
  try { const r = await fetch("/api/list?col=" + col); return await r.json(); } catch (e) { return []; }
}
function fmtT(ts) { const d = new Date(ts * 1000); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
function fmtD(ts) { const d = new Date(ts * 1000); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getFullYear()).slice(2); }
function ago(ts) {
  const m = Math.max(0, Math.round((Date.now() / 1000 - ts) / 60));
  if (m < 60) return "לפני " + (m <= 1 ? "דקה" : m + " דקות");
  const h = Math.round(m / 60); if (h < 24) return "לפני " + h + " שעות";
  return "לפני " + Math.round(h / 24) + " ימים";
}
function bar(pct, w) {
  w = w || 18;
  const f = Math.max(0, Math.min(w, Math.round((pct / 100) * w)));
  return '<span class="f">' + "█".repeat(f) + "</span>" + "░".repeat(w - f);
}
function kfmt(n) { n = n || 0; return n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n); }

let CACHE = { articles: [], blogs: [], ticker: [], matches: [], polls: [] };
async function loadAll() {
  const cols = ["articles", "blogs", "ticker", "matches", "polls"];
  const res = await Promise.all(cols.map(apiList));
  CACHE = { articles: res[0], blogs: res[1], ticker: res[2], matches: res[3], polls: res[4] };
}

function viewHome() {
  const t = CACHE.ticker, arts = CACHE.articles;
  const latest = t[0];
  const hot = arts.slice().sort((x, y) => (y.views || 0) - (x.views || 0)).slice(0, 3);
  const poll = CACHE.polls[0];
  let h = '';
  h += '<section class="hero"><div class="wrap">';
  h += '<div class="kicker rv">מערכת חדשות חיה · ' + esc(TAGLINE) + '</div>';
  h += '<h1 class="rv">מה קורה<br>עכשיו<span class="q">?</span></h1>';
  if (latest) {
    h += '<div class="latest rv" onclick="location.hash=\'#live\'">';
    h += '<div class="t mono">' + fmtT(latest.ts) + '</div>';
    h += '<div><div class="tx">' + esc(latest.text) + '</div>';
    h += '<div class="meta">' + ago(latest.ts) + ' · מבזק אחרון</div></div></div>';
  }
  h += '</div></section>';

  h += '<section class="block" id="live"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2><span class="pulse"></span>LIVE - מבזקים</h2><span class="tag">מתעדכן בזמן אמת</span></div>';
  h += '<div class="tl">';
  t.slice(0, 8).forEach(function (it, i) {
    const cls = i === 0 ? "hot" : (i % 3 === 2 ? "bolt" : "");
    h += '<div class="tl-item rv ' + cls + '"><span class="dot"></span>';
    h += '<div class="tt">' + fmtT(it.ts) + '</div>';
    h += '<div class="bx">' + esc(it.text) + '</div>';
    h += '<div class="ago">' + ago(it.ts) + '</div></div>';
  });
  h += '</div></div></section>';

  h += '<section class="block" id="hot"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2>🔥 הכי חם</h2><span class="tag">הכי נקרא עכשיו</span></div>';
  hot.forEach(function (a, i) {
    h += '<div class="hotrow rv" onclick="location.hash=\'#/article/' + a._id + '\'">';
    h += '<div class="num">0' + (i + 1) + '</div>';
    h += '<div><h3>' + esc(a.title) + '</h3>';
    h += '<div class="hm"><span>💬 ' + (a.comments || 0) + ' תגובות</span><span class="r">🔥 ' + kfmt(a.views) + ' צפיות</span><span>' + ago(a.ts) + '</span></div></div></div>';
  });
  h += '</div></section>';

  h += '<section class="block" id="articles"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2>📰 כתבות</h2><span class="tag">טקסט. בלי רעש.</span></div><div class="cards">';
  arts.forEach(function (a) {
    h += '<div class="tcard rv" onclick="location.hash=\'#/article/' + a._id + '\'">';
    h += '<div class="cat">' + esc(a.category || "כתבה") + '</div>';
    h += '<h3>' + esc(a.title) + '</h3><p>' + esc(a.summary || "") + '</p>';
    h += '<div class="dt">' + fmtD(a.ts) + ' · ' + fmtT(a.ts) + ' · ' + esc(a.author || BRAND) + '</div></div>';
  });
  h += '</div></div></section>';
  return h + viewHome2(poll);
}
function viewHome2(poll) {
  let h = '';
  h += '<section class="block" id="matches"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2>⚽ משחקים</h2><span class="tag">תוצאות ואירועים</span></div>';
  CACHE.matches.forEach(function (m) {
    h += '<div class="match rv"><div class="round">' + esc(m.round || "") + '</div>';
    h += '<div class="score"><div class="team">' + esc(m.home) + '</div>';
    h += '<div class="nums"><span class="h">' + m.hs + '</span><span class="dv">─</span><span>' + m.as + '</span></div>';
    h += '<div class="team">' + esc(m.away) + '</div></div>';
    h += '<div class="st ' + (m.live ? "live" : "") + '">' + esc(m.status || "") + '</div>';
    if (m.events && m.events.length) {
      h += '<div class="events">';
      m.events.forEach(function (e) {
        h += '<div class="ev"><span class="m">' + esc(e.min) + "'</span><span>" + esc(e.icon) + '</span><span class="x">' + esc(e.text) + '</span></div>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div></section>';

  h += '<section class="block" id="stats"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2>📊 סטטיסטיקות</h2><span class="tag">המספרים מספרים</span></div>';
  h += '<div class="stats"><div class="rank rv"><div class="lbl">מיקום בטבלה</div><div class="big">#3</div></div>';
  h += '<div class="srows rv">';
  h += '<div class="sr"><span>משחקים</span><b>4</b></div>';
  h += '<div class="sr"><span>ניצחונות</span><b class="w">3</b></div>';
  h += '<div class="sr"><span>תיקו</span><b>0</b></div>';
  h += '<div class="sr"><span>הפסדים</span><b>1</b></div>';
  h += '<div class="sr"><span>שערי זכות</span><b class="w">9</b></div>';
  h += '<div class="sr"><span>שערי חובה</span><b>4</b></div>';
  h += '<div class="barline">' + bar(75) + '<span class="pc">75% נקודות</span></div>';
  h += '</div></div></div></section>';

  if (poll) {
    const voted = localStorage.getItem("voted_" + poll._id);
    h += '<section class="block" id="poll"><div class="wrap">';
    h += '<div class="sec-hd rv"><h2>🔴 קול האוהדים</h2><span class="tag">הסקר של המערכת</span></div>';
    h += '<div class="pollq rv">' + esc(poll.question) + '</div>';
    h += '<div id="pollBox" class="rv ' + (voted ? "pollvoted" : "") + '">';
    poll.opts.forEach(function (o, i) {
      const pct = poll.total ? Math.round((o.votes / poll.total) * 100) : 0;
      h += '<div class="opt" onclick="vote(\'' + poll._id + '\',' + i + ')">';
      h += '<div class="orow"><span class="ol">' + esc(o.label) + '</span><span class="op">' + pct + '%</span></div>';
      h += '<div class="barline">' + bar(pct) + '</div></div>';
    });
    h += '<div class="polltotal"><b>' + (poll.total || 0) + '</b> אוהדים הצביעו</div>';
    h += '</div></div></section>';
  }

  h += '<section class="block" id="blogs"><div class="wrap">';
  h += '<div class="sec-hd rv"><h2>✍️ בלוגי אוהדים</h2><a class="tag" href="#/blog">לכל הבלוגים ←</a></div>';
  CACHE.blogs.slice(0, 3).forEach(function (b) {
    h += '<div class="brow rv" onclick="location.hash=\'#/post/' + b._id + '\'">';
    h += '<span class="bt">' + esc(b.title) + '</span>';
    h += '<span class="bm">' + esc(b.author) + ' · ' + ago(b.ts) + '</span></div>';
  });
  h += '</div></section>';

  h += '<footer><div class="foot-brand">' + esc(BRAND).replace("הצייץ", '<span class="r">הצייץ</span>') + '</div>';
  h += '<div class="fl">' + esc(TAGLINE) + ' · נבנה על טקסט בלבד · Cloudflare Workers</div></footer>';
  return h;
}

async function vote(id, idx) {
  if (localStorage.getItem("voted_" + id)) return;
  localStorage.setItem("voted_" + id, "1");
  try {
    const r = await fetch("/api/vote", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: id, idx: idx }) });
    const d = await r.json();
    if (d.ok) {
      const p = CACHE.polls.find(function (x) { return x._id === id; });
      if (p) { p.opts = d.poll.opts; p.total = d.poll.total; }
      renderHome();
      setTimeout(function () { const el = document.getElementById("poll"); if (el) el.scrollIntoView(); }, 30);
    }
  } catch (e) {}
}

function renderHome() { $("#app").innerHTML = viewHome(); reveal(); }

function viewArticle(id) {
  const a = CACHE.articles.find(function (x) { return x._id === id; });
  if (!a) { $("#app").innerHTML = '<div class="art"><p class="msg err">הכתבה לא נמצאה.</p></div>'; return; }
  fetch("/api/view", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ col: "articles", id: id }) });
  a.views = (a.views || 0) + 1;
  const paras = (a.body || "").split(/\n+/).filter(Boolean).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  $("#app").innerHTML = '<div class="art">' +
    '<div class="back" onclick="history.back()">← חזרה</div>' +
    '<div class="cat">' + esc(a.category || "כתבה") + '</div>' +
    '<h1>' + esc(a.title) + '</h1>' +
    '<div class="meta">' + fmtD(a.ts) + ' · ' + fmtT(a.ts) + ' · ' + esc(a.author || BRAND) + ' · ' + kfmt(a.views) + ' צפיות</div>' +
    '<div class="lede">' + esc(a.summary || "") + '</div>' +
    '<div class="body">' + paras + '</div></div>';
  window.scrollTo(0, 0);
}

function viewBlog() {
  let h = '<div class="art"><div class="back" onclick="location.hash=\'#/\'">← לבית</div>' +
    '<div class="cat">✍️ בלוגי אוהדים</div><h1>הקהל כותב</h1>';
  CACHE.blogs.forEach(function (b) {
    h += '<div class="brow" style="padding:22px 0" onclick="location.hash=\'#/post/' + b._id + '\'">' +
      '<span class="bt" style="font-size:21px">' + esc(b.title) + '</span>' +
      '<span class="bm">' + esc(b.author) + ' · ' + ago(b.ts) + '</span></div>';
  });
  $("#app").innerHTML = h + '</div>';
  window.scrollTo(0, 0);
}
function viewPost(id) {
  const b = CACHE.blogs.find(function (x) { return x._id === id; });
  if (!b) { $("#app").innerHTML = '<div class="art"><p class="msg err">הפוסט לא נמצא.</p></div>'; return; }
  const paras = (b.body || "").split(/\n+/).filter(Boolean).map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("");
  $("#app").innerHTML = '<div class="art">' +
    '<div class="back" onclick="location.hash=\'#/blog\'">← לבלוגים</div>' +
    '<div class="cat">✍️ בלוג אוהדים</div><h1>' + esc(b.title) + '</h1>' +
    '<div class="meta">' + fmtD(b.ts) + ' · ' + fmtT(b.ts) + ' · ' + esc(b.author) + '</div>' +
    '<div class="body" style="margin-top:30px">' + paras + '</div></div>';
  window.scrollTo(0, 0);
}
/* ============ ADMIN ============ */
const APW = function () { return sessionStorage.getItem("gamal_admin") || ""; };
async function adminApi(body) {
  const r = await fetch("/api/admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({}, body, { password: APW() })) });
  return r.json();
}
let ATAB = "articles";
function viewAdmin() {
  if (!APW()) {
    $("#app").innerHTML = '<div class="admin"><h1>🔐 כניסת עורכים</h1><div class="sub">ADMIN ACCESS</div>' +
      '<div class="afield"><label>סיסמת ניהול</label><input type="password" id="apw" placeholder="הזן סיסמה"></div>' +
      '<button class="abtn" onclick="doLogin()">כניסה</button><div class="msg" id="amsg"></div></div>';
    return;
  }
  const tabs = [["articles", "כתבות"], ["ticker", "מבזקים"], ["blogs", "בלוגים"], ["matches", "משחקים"], ["polls", "סקר"]];
  let h = '<div class="admin"><h1>ניהול האתר</h1><div class="sub">' + esc(BRAND) + ' · ADMIN · <a href="javascript:void(0)" onclick="sessionStorage.removeItem(\'gamal_admin\');route()" style="color:var(--red)">יציאה</a></div>';
  h += '<div class="atabs">';
  tabs.forEach(function (tb) {
    h += '<button class="' + (ATAB === tb[0] ? "on" : "") + '" onclick="ATAB=\'' + tb[0] + '\';viewAdmin()">' + tb[1] + '</button>';
  });
  h += '</div><div id="aform"></div><div class="alist" id="alist"></div></div>';
  $("#app").innerHTML = h;
  renderAForm();
  renderAList();
  window.scrollTo(0, 0);
}
async function doLogin() {
  const pw = $("#apw").value;
  sessionStorage.setItem("gamal_admin", pw);
  const d = await adminApi({ action: "check" });
  if (d.ok) { viewAdmin(); } else { sessionStorage.removeItem("gamal_admin"); $("#amsg").textContent = "סיסמה שגויה"; $("#amsg").className = "msg err"; }
}
function renderAForm() {
  let h = "";
  if (ATAB === "articles") {
    h = fIn("a_title", "כותרת") + fIn("a_sum", "תקציר") + fSel("a_cat", "קטגוריה", ["העברות", "ניתוחים", "טורי דעה"]) +
      fIn("a_author", "כתב/ת") + fTa("a_body", "גוף הכתבה (שורה ריקה בין פסקאות)", 6) +
      '<button class="abtn" onclick="aCreateArticle()">פרסם כתבה</button><div class="msg" id="amsg"></div>';
  } else if (ATAB === "ticker") {
    h = fIn("t_text", "טקסט המבזק") + '<button class="abtn" onclick="aCreateTicker()">שדר מבזק</button><div class="msg" id="amsg"></div>';
  } else if (ATAB === "blogs") {
    h = fIn("b_title", "כותרת") + fIn("b_author", "שם הכותב") + fTa("b_body", "גוף הבלוג", 6) +
      '<button class="abtn" onclick="aCreateBlog()">פרסם בלוג</button><div class="msg" id="amsg"></div>';
  } else if (ATAB === "matches") {
    h = fIn("m_round", "מחזור (למשל: מחזור 4)") + fIn("m_home", "קבוצת בית") + fIn("m_away", "קבוצת חוץ") +
      fIn("m_hs", "שערי בית") + fIn("m_as", "שערי חוץ") + fIn("m_status", "סטטוס (למשל: הסתיים · 20:15)") +
      fTa("m_events", "אירועים - שורה לכל אירוע: דקה|אימוג׳י|טקסט (67|⚽|1-1)", 4) +
      '<button class="abtn" onclick="aCreateMatch()">הוסף משחק</button><div class="msg" id="amsg"></div>';
  } else if (ATAB === "polls") {
    h = fIn("p_q", "שאלת הסקר") + fIn("p_o1", "אפשרות 1") + fIn("p_o2", "אפשרות 2") +
      '<button class="abtn" onclick="aCreatePoll()">פרסם סקר</button><div class="msg" id="amsg"></div>';
  }
  $("#aform").innerHTML = h;
}
function fIn(id, l) { return '<div class="afield"><label>' + l + '</label><input id="' + id + '"></div>'; }
function fTa(id, l, r) { return '<div class="afield"><label>' + l + '</label><textarea id="' + id + '" rows="' + r + '"></textarea></div>'; }
function fSel(id, l, opts) {
  return '<div class="afield"><label>' + l + '</label><select id="' + id + '">' + opts.map(function (o) { return "<option>" + o + "</option>"; }).join("") + "</select></div>";
}
function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ""; }
function aMsg(t, ok) { const m = $("#amsg"); if (m) { m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); } }
async function afterCreate(d) {
  if (d.ok) { aMsg("פורסם ✓", true); await loadAll(); renderAList(); } else aMsg("שגיאה: " + (d.error || ""), false);
}
async function aCreateArticle() {
  const d = await adminApi({ action: "create", col: "articles", payload: { title: val("a_title"), summary: val("a_sum"), category: val("a_cat"), author: val("a_author") || BRAND, body: val("a_body"), ts: Math.floor(Date.now() / 1000), views: 0, comments: 0 } });
  afterCreate(d);
}
async function aCreateTicker() {
  const d = await adminApi({ action: "create", col: "ticker", payload: { text: val("t_text"), ts: Math.floor(Date.now() / 1000) } });
  afterCreate(d);
}
async function aCreateBlog() {
  const d = await adminApi({ action: "create", col: "blogs", payload: { title: val("b_title"), author: val("b_author"), body: val("b_body"), ts: Math.floor(Date.now() / 1000) } });
  afterCreate(d);
}
async function aCreateMatch() {
  const evs = val("m_events").split("\n").filter(Boolean).map(function (ln) {
    const p = ln.split("|"); return { min: (p[0] || "").trim(), icon: (p[1] || "").trim(), text: (p[2] || "").trim() };
  });
  const d = await adminApi({ action: "create", col: "matches", payload: { round: val("m_round"), home: val("m_home"), away: val("m_away"), hs: val("m_hs"), as: val("m_as"), status: val("m_status"), events: evs, ts: Math.floor(Date.now() / 1000) } });
  afterCreate(d);
}
async function aCreatePoll() {
  const d = await adminApi({ action: "create", col: "polls", payload: { question: val("p_q"), opts: [{ label: val("p_o1"), votes: 0 }, { label: val("p_o2"), votes: 0 }], total: 0, ts: Math.floor(Date.now() / 1000) } });
  afterCreate(d);
}
function renderAList() {
  const items = CACHE[ATAB] || [];
  let h = "";
  items.forEach(function (it) {
    const label = it.title || it.text || it.question || ((it.home || "") + " " + (it.hs || "") + "-" + (it.as || "") + " " + (it.away || ""));
    h += '<div class="aitem"><span>' + esc(label) + '</span><button class="del" onclick="aDel(\'' + it._id + '\')">מחק</button></div>';
  });
  $("#alist").innerHTML = h || '<div class="msg">אין פריטים עדיין</div>';
}
async function aDel(id) {
  const d = await adminApi({ action: "remove", col: ATAB, id: id });
  if (d.ok) { await loadAll(); renderAList(); }
}
/* ============ FX + ROUTER ============ */
function reveal() {
  const els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("in"); }); return; }
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.08 });
  els.forEach(function (e) { io.observe(e); });
}
window.addEventListener("scroll", function () {
  const onArt = location.hash.indexOf("#/article/") === 0 || location.hash.indexOf("#/post/") === 0;
  if (!onArt) { $("#pbar").style.width = "0"; return; }
  const d = document.documentElement;
  const pct = d.scrollTop / (d.scrollHeight - d.clientHeight || 1) * 100;
  $("#pbar").style.width = pct + "%";
}, { passive: true });
document.getElementById("moreBtn").addEventListener("click", function () {
  document.getElementById("sheet").classList.toggle("open");
});
document.getElementById("sheet").addEventListener("click", function () {
  document.getElementById("sheet").classList.remove("open");
});

let LOADED = false;
async function route() {
  const h = location.hash || "#/";
  document.getElementById("sheet").classList.remove("open");
  if (!LOADED) { await loadAll(); LOADED = true; }
  if (h === "#/" || h === "#") renderHome();
  else if (h.indexOf("#/article/") === 0) viewArticle(h.split("/")[2]);
  else if (h.indexOf("#/post/") === 0) viewPost(h.split("/")[2]);
  else if (h === "#/blog") viewBlog();
  else if (h === "#/admin") viewAdmin();
  else {
    renderHome();
    const id = h.replace("#/", "").replace("#", "");
    setTimeout(function () { const el = document.getElementById(id); if (el) el.scrollIntoView(); }, 60);
  }
}
window.addEventListener("hashchange", route);
route();
setInterval(async function () {
  const h = location.hash || "#/";
  if (h === "#/" || h === "#") { await loadAll(); renderHome(); }
}, 60000);
</script>
